name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ALSA headers (cpal on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Binary size (spec N-12, at most 10 MB)
        shell: bash
        run: |
          bin=target/release/sf2_player
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "size: $size bytes"
          [ "$size" -le $((10 * 1024 * 1024)) ] || { echo "binary exceeds 10 MB"; exit 1; }

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sf2_player-${{ runner.os }}
          path: |
            target/release/sf2_player
            target/release/sf2_player.exe
          if-no-files-found: error
