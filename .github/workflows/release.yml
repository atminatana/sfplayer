name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: sf2_player-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: sf2_player-${{ github.ref_name }}-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: sf2_player-${{ github.ref_name }}-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: sf2_player-${{ github.ref_name }}-macos-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ALSA headers (cpal on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/sf2_player.exe dist/
            cp README.md LICENSE-MIT LICENSE-APACHE dist/
            (cd dist && 7z a ../${{ matrix.archive }} *)
          else
            cp target/${{ matrix.target }}/release/sf2_player dist/
            cp README.md LICENSE-MIT LICENSE-APACHE dist/
            tar -czf ${{ matrix.archive }} -C dist .
          fi

      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
