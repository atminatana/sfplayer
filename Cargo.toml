[package]
name = "sf2_player"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Console cross-platform SoundFont synthesizer: MIDI in, SF2 bank, audio out"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
directories = "6.0"
midir = "0.11"
ratatui = "0.30"
ringbuf = "0.5"
rust-i18n = "4"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
