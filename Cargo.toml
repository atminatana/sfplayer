[package]
name = "sf2_player"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SoundFont synthesizer in a cell-grid window: MIDI in, SF2 bank, audio out"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
directories = "6.0"
flacenc = "0.5"
# Window with a cell grid and immediate-mode widgets (spec v1.2, ADR 0012). Both crates must
# point at the same revision; it carries the application tick, the Meter widget, the double click and the Slider control
# (gterm ADR-0033 to ADR-0036).
gterm = { git = "https://github.com/atminatana/gterm", rev = "106d1ce1c2714639ee0486707b800849cef615a4" }
gterm-widgets = { git = "https://github.com/atminatana/gterm", rev = "106d1ce1c2714639ee0486707b800849cef615a4" }
midir = "0.11"
ringbuf = "0.5"
rust-i18n = "4"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
vorbis_rs = "0.5"
# Key and modifier types of gterm events arrive untranslated; same version and features as gterm uses.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# WASAPI in exclusive mode (spec v1.4, ADR 0019): cpal opens shared streams only. The same crate and
# version cpal itself builds on.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Security",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Threading",
	"Win32_System_Variant",
] }

[features]
# ASIO on Windows (spec v1.4, ADR 0019): the build needs LLVM (libclang), MSVC and the Steinberg
# ASIO SDK; see README. Off by default, and release archives are built without it.
asio = ["cpal/asio"]

[dev-dependencies]
claxon = "0.4.3"
lewton = "0.10.2"
