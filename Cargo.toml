[package]
name = "sf2_player"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Console cross-platform SoundFont synthesizer: MIDI in, SF2 bank, audio out"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
rustysynth = "1.3"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
