[package]
name = "sf2_player"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SoundFont synthesizer in a cell-grid window: MIDI in, SF2 bank, audio out"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18"
directories = "6.0"
flacenc = "0.5"
# Window with a cell grid and immediate-mode widgets (spec v1.2, ADR 0012). Both crates must
# point at the same revision; it carries the application tick, the Meter widget, the double click and the Slider control
# (gterm ADR-0033 to ADR-0036).
gterm = { git = "https://github.com/atminatana/gterm", rev = "c3eb60bfaf11138b783e663f94f5aaab530b3f94" }
gterm-widgets = { git = "https://github.com/atminatana/gterm", rev = "c3eb60bfaf11138b783e663f94f5aaab530b3f94" }
midir = "0.11"
ringbuf = "0.5"
rust-i18n = "4"
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
thiserror = "2.0"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
vorbis_rs = "0.5"
# Key and modifier types of gterm events arrive untranslated; same version and features as gterm uses.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dev-dependencies]
claxon = "0.4.3"
lewton = "0.10.2"
